# Jenkins Configuration as Code - cria o usuário admin automaticamente
# e habilita uma autenticação simples para fins acadêmicos.
jenkins:
  systemMessage: "Jenkins - AC Qualidade e Teste de Software"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: "http://localhost:8080/"
